<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kha · bus health</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="favicon.svg" alt="">
      <span class="brand-name">kha</span>
      <span class="brand-sub">bus health</span>
    </div>
    <div class="summary" id="summary"></div>
    <div class="snapshot" id="snapshot"></div>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <main class="layout">
    <div class="column">
      <section class="card">
        <h2 class="card-title">Bus map <span class="card-hint">cable order, click a node</span></h2>
        <div class="bus" id="bus"></div>
        <div class="legend">
          <span class="legend-item"><span class="dot state-ok"></span>ok</span>
          <span class="legend-item"><span class="dot state-errors"></span>errors</span>
          <span class="legend-item"><span class="dot state-missing"></span>missing</span>
          <span class="legend-item"><span class="dot state-unknown"></span>unknown</span>
          <span class="legend-item"><span class="swatch-unusual"></span>unusual (see flags)</span>
        </div>
      </section>
    </div>

    <aside class="card detail" id="detail"></aside>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
